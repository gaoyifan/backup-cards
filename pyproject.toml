[project]
name = "sd-backup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.3",
    "gql[websockets]>=4.0.0",
    "pywebview>=5.3.2",
    "psutil>=7.1.3",
    "pyudev>=0.24.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "strawberry-graphql>=0.287.0",
    "textual>=6.6.0",
    "textual-dev>=1.8.0",
    "typer>=0.12.5",
    "uvicorn>=0.38.0",
    "asyncer>=0.0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "requests>=2.32.5",
    "pyinstaller>=6.11.0",
    "autoflake>=2.3.1",
    "isort>=7.0.0",
    "black>=25.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/frontend", "app.py"]
